spring.application.name=online-public-opinion-analysis
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/public_opinion?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis-Plus
mybatis-plus.mapper-locations=classpath:mapper/**/*.xml
mybatis-plus.type-aliases-package=com.bupt.publicopinion.*.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=AUTO

# JWT
jwt.access-token-expiration=15m
jwt.refresh-token-expiration=7d
jwt.secret=ZGFmZGZnZGZnZGY0MzUzNDVzZGZzZGZzZGYyMzQyNDIzMzQ1MzQ1MzQ1MzQ1MzQ1MzRmZ2ZkZzM0NQ==

# Crawler
crawler.service.base-url=http://127.0.0.1:8001
crawler.service.connect-timeout=3s
crawler.service.read-timeout=30s

# Content
content.service.base-url=http://127.0.0.1:8002
content.service.connect-timeout=3s
content.service.read-timeout=30s

# Intelligence (sentiment analysis, clustering)
intelligence.service.base-url=http://127.0.0.1:8003
intelligence.service.connect-timeout=3s
intelligence.service.read-timeout=30s

# Report & QA
report.service.base-url=http://127.0.0.1:8004
report.service.connect-timeout=3s
report.service.read-timeout=30s
