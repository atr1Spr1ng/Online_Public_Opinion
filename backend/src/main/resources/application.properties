spring.application.name=online-public-opinion-analysis
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/public_opinion?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis-Plus
mybatis-plus.mapper-locations=classpath:mapper/**/*.xml
mybatis-plus.type-aliases-package=com.bupt.publicopinion
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# JWT
jwt.access-token-expiration=15m
jwt.refresh-token-expiration=7d
jwt.secret=ZGFmZGZnZGZnZGY0MzUzNDVzZGZzZGZzZGYyMzQyNDIzMzQ1MzQ1MzQ1MzQ1MzQ1MzRmZ2ZkZzM0NQ==

# Crawler
crawler.service.base-url=http://127.0.0.1:8001
crawler.service.connect-timeout=3s
crawler.service.read-timeout=30s
