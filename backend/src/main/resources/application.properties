spring.application.name=online-public-opinion-analysis
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/online_public_opinion?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis-plus.mapper-locations=classpath:mapper/**/*.xml
mybatis-plus.type-aliases-package=com.bupt.publicopinion.*.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=AUTO

crawler.service.base-url=http://127.0.0.1:8001
crawler.service.connect-timeout=3s
crawler.service.read-timeout=30s
